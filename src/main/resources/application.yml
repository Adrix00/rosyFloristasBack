spring:
  application:
    name: rosy-floristas-back
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:rosy}
    username: ${POSTGRES_USER:rosy}
    password: ${POSTGRES_PASSWORD:rosy}
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

app:
  security:
    pii-encryption-key: ${PII_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    pii-hmac-pepper: ${PII_HMAC_PEPPER:dev-only-insecure-pepper-change-me}
  bootstrap:
    owner-email: ${BOOTSTRAP_OWNER_EMAIL:}
    owner-password: ${BOOTSTRAP_OWNER_PASSWORD:}
