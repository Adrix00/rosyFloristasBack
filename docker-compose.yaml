services:
  rosy-db:
    image: postgres:16
    container_name: rosy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rosy_pgdata:/var/lib/postgresql/data

volumes:
  rosy_pgdata:
