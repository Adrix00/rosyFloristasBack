name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored if 'version' is set)"
        required: false
        type: choice
        options:
          - major
          - minor
      version:
        description: "Explicit version to release, e.g. 2.0.0 (overrides bump)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make scripts executable
        run: chmod +x mvnw scripts/*.sh

      - name: Create release branch and first tag
        run: scripts/create-release.sh "${{ inputs.bump }}" --version "${{ inputs.version }}"
