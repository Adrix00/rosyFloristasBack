name: Release Sync

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch to sync into main, e.g. release/1.3.x"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Sync release branch into main
        run: scripts/merge-main.sh "${{ inputs.release_branch }}"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
