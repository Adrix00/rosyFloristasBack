name: Continuous Integration

on:
  push:
    branches:
      - main
      - feature/**
      - hotfix/**
      - bugfix/**
      - release/**
      - tags/**
  pull_request:
    branches:
      - main
      - feature/**
      - hotfix/**
      - bugfix/**
      - release/**

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build project
        run: ./mvnw clean verify